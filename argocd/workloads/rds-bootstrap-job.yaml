# RDS Postgres bootstrap.
#
# RDS provisions the 'discourse' database itself (DBInstance.spec.dbName)
# but won't create the application user. Connect as the master postgres
# user and ensure discourse_app_user exists with the pinned password
# from mzla/discourse/db.
#
# Idempotent. Sync hook so re-runs reset the password to match the
# current ExternalSecret value (covers SM rotations).
apiVersion: batch/v1
kind: Job
metadata:
  name: discourse-rds-bootstrap
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discourse
        app.kubernetes.io/component: rds-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16-alpine
          env:
            # PGHOST is patched in once the DBInstance reports its endpoint.
            # See README "Bootstrap RDS endpoint" for how to update it
            # (kubectl patch or a one-off PR after first sync).
            - name: PGHOST
              value: discourse-postgres.c18simi4g02c.eu-central-1.rds.amazonaws.com
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: discourse
            - name: PGSSLMODE
              value: require
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: discourse-db-credentials
                  key: masterPassword
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discourse-db-credentials
                  key: appPassword
          command:
            - sh
            - -ec
            - |
              APP_USER=discourse_app_user
              echo "Waiting for RDS host..."
              until pg_isready -q; do sleep 5; done

              echo "Ensuring role ${APP_USER} exists..."
              if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='${APP_USER}'" | grep -q 1; then
                psql -c "CREATE USER ${APP_USER} WITH LOGIN"
              fi

              echo "Setting password for ${APP_USER}..."
              # Pass via stdin so psql does the substitution properly --
              # `-c "ALTER ... :'app_pw'"` doesn't process :'name' refs
              # the same way scripted SQL does (errors with "syntax error at
              # or near :"). Safe with alphanumeric Pulumi RandomPassword
              # values (special=False).
              psql -v ON_ERROR_STOP=1 -v "app_pw=${APP_PASSWORD}" <<SQL
              ALTER USER ${APP_USER} WITH PASSWORD :'app_pw';
              SQL

              echo "Granting database + public schema privileges..."
              psql -v ON_ERROR_STOP=1 <<SQL
              GRANT ALL PRIVILEGES ON DATABASE discourse TO ${APP_USER};
              GRANT CREATE ON DATABASE discourse TO ${APP_USER};
              GRANT ALL PRIVILEGES ON SCHEMA public TO ${APP_USER};
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES    TO ${APP_USER};
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO ${APP_USER};
              SQL

              # Discourse requires hstore + pg_trgm; create with master
              # creds since the app user lacks SUPERUSER.
              echo "Ensuring required extensions..."
              psql -v ON_ERROR_STOP=1 <<SQL
              CREATE EXTENSION IF NOT EXISTS hstore;
              CREATE EXTENSION IF NOT EXISTS pg_trgm;
              SQL
              echo "Done."
