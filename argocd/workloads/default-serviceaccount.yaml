# Overlay the discourse namespace's default ServiceAccount with an IRSA
# annotation. Discourse's web + sidekiq pods run under 'default' (we don't
# wire a chart, so no custom SA is set on the Deployment specs); the IRSA
# role grants S3 access for upload reads/writes against the
# mzla-discourse-uploads bucket.
#
# The role workloads-prod-discourse-default is created in
# platform-infrastructure/pulumi/environments/mzla-workloads (config.prod.yaml).
# Trust policy is bound to system:serviceaccount:discourse:default.
#
# Without this annotation Discourse falls through the AWS provider chain
# and uploads fail with NoCredentialProviders.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    eks.amazonaws.com/role-arn: arn:aws:iam::668807881758:role/workloads-prod-discourse-default
