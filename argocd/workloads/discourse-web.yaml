# Discourse web (Puma + Rails). One Deployment, Service on :3000.
# The image is built from container/ in this repo and pushed to
# 668807881758.dkr.ecr.eu-central-1.amazonaws.com/discourse:<tag>.
#
# Health: Discourse exposes /srv/status which returns 200 once Rails is
# ready. Use it for liveness + readiness.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discourse-web
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: discourse
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: discourse
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discourse
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: default  # IRSA-annotated by default-serviceaccount.yaml
      containers:
        - name: discourse
          image: 668807881758.dkr.ecr.eu-central-1.amazonaws.com/discourse:latest
          imagePullPolicy: Always
          # discourse_docker images don't set CMD to /sbin/boot at the
          # Dockerfile level; without an explicit command pups runs
          # with no config and crashes ("Reading from stdin" + nil
          # config). /sbin/boot starts runit + Puma the way launcher
          # does at runtime.
          command: ["/sbin/boot"]
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 7001  # discourse-prometheus plugin port
          envFrom:
            - configMapRef:
                name: discourse-config
          env:
            - name: DISCOURSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discourse-db-credentials
                  key: appPassword
            - name: DISCOURSE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discourse-redis-credentials
                  key: authToken
            - name: DISCOURSE_SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: discourse-app-secrets
                  key: secretKeyBase
            - name: DISCOURSE_DEVELOPER_EMAILS
              valueFrom:
                secretKeyRef:
                  name: discourse-app-secrets
                  key: developerEmails
            - name: DISCOURSE_SMTP_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: discourse-smtp-credentials
                  key: username
            - name: DISCOURSE_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discourse-smtp-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /srv/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /srv/status
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            # 250m fits 2 web replicas + sidekiq on the existing
            # Graviton nodegroup (m7g.large = 2 vCPU each, 4 nodes,
            # ~1.5 vCPU schedulable per node after kube-system).
            # Bump back to 500m once the cluster has more capacity.
            requests:
              cpu: "250m"
              memory: "1.5Gi"
            limits:
              memory: "3Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: discourse-web
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: discourse
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: discourse
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
