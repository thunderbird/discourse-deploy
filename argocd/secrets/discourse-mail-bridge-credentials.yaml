# Discourse API key used by discourse-mail-bridge to POST inbound mail to
# /admin/email/handle_mail.
# Source: mzla/discourse/inbound in Secrets Manager (eu-central-1, 668807881758).
#
# Create the key in Discourse: Admin -> API -> New API Key, user "system",
# scope Granular -> email: receive_emails (nothing else). Store it as
#   {"api_key": "<key>"}
# in mzla/discourse/inbound. The SM secret shell is created by
# platform-infrastructure Pulumi; the value is set by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discourse-mail-bridge-credentials
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: discourse-mail-bridge-credentials
    creationPolicy: Owner
  data:
    - secretKey: DISCOURSE_API_KEY
      remoteRef:
        key: mzla/discourse/inbound
        property: api_key
