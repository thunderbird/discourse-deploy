# ElastiCache Redis AUTH token for Discourse.
# Source: mzla/discourse/redis in Secrets Manager (eu-central-1, 668807881758).
# The same authToken value is consumed by:
#   - the ACK ReplicationGroup (sets AUTH on the cluster)
#   - the Discourse web + sidekiq pods via DISCOURSE_REDIS_PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discourse-redis-credentials
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: discourse-redis-credentials
    creationPolicy: Owner
  data:
    - secretKey: authToken
      remoteRef:
        key: mzla/discourse/redis
        property: authToken
