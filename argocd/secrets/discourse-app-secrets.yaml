# Discourse application secrets.
# Source: mzla/discourse/app in Secrets Manager (eu-central-1, 668807881758).
#   secretKeyBase     -> DISCOURSE_SECRET_KEY_BASE (Rails session/cookie signing)
#   adminPassword     -> initial admin user password, consumed by container
#                        bootstrap to seed DEVELOPER_EMAILS user
#   developerEmails   -> DISCOURSE_DEVELOPER_EMAILS (comma-separated list of
#                        addresses promoted to admin on first boot)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discourse-app-secrets
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: discourse-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: secretKeyBase
      remoteRef:
        key: mzla/discourse/app
        property: secretKeyBase
    - secretKey: adminPassword
      remoteRef:
        key: mzla/discourse/app
        property: adminPassword
    - secretKey: developerEmails
      remoteRef:
        key: mzla/discourse/app
        property: developerEmails
