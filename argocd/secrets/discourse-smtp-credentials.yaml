# SES SMTP credentials for outbound mail.
# Source: mzla/discourse/smtp in Secrets Manager (eu-central-1, 668807881758).
# Pulumi creates an IAM user (workloads-prod-discourse-ses) with a policy
# allowing ses:SendEmail / ses:SendRawEmail, generates an access key, and
# computes the SES SMTP password (HMAC-SHA256 v4 derivation of the secret
# access key). Both values are stored in this SM secret.
#
# SES sandbox status: ProductionAccessEnabled=false on this account
# (case 177704803400657 was DENIED). Re-request before user-facing launch.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discourse-smtp-credentials
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: discourse-smtp-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: mzla/discourse/smtp
        property: username
    - secretKey: password
      remoteRef:
        key: mzla/discourse/smtp
        property: password
