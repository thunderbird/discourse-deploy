# Cloudflare tunnel credentials for external access to Discourse.
# Sources the *shared* mzla/twenty/cloudflare SM key (same Cloudflare
# account / API token already in use by twenty-deploy). No separate
# discourse-scoped CF secret -- one token covers both apps.
#
# Key names match what the cloudflare-tunnel-operator expects on the
# Tunnel CR's `secret` reference.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-secrets
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cloudflare-secrets
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: mzla/twenty/cloudflare
        property: apiToken
    - secretKey: CLOUDFLARE_ACCOUNT_ID
      remoteRef:
        key: mzla/twenty/cloudflare
        property: accountID
