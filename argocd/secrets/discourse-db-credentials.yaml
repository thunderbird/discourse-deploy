# RDS Postgres credentials for Discourse.
# Source: mzla/discourse/db in Secrets Manager (eu-central-1, 668807881758),
# created by Pulumi in platform-infrastructure/pulumi/environments/mzla-workloads.
#   masterPassword -> postgres superuser, used by ACK DBInstance + bootstrap Job
#   appPassword    -> discourse_app_user, used by Discourse runtime
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discourse-db-credentials
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: discourse-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: masterPassword
      remoteRef:
        key: mzla/discourse/db
        property: masterPassword
    - secretKey: appPassword
      remoteRef:
        key: mzla/discourse/db
        property: appPassword
