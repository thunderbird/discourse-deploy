# Pod scrape for Discourse web. The discourse-prometheus plugin
# (cloned in by container/containers/app.yml) exposes metrics on
# :9405/metrics, but the plugin must be enabled:
#   Admin -> Plugins -> discourse-prometheus -> enabled
# AND DISCOURSE_PROMETHEUS_WEBSERVER_BIND=0.0.0.0 must be set in the
# ConfigMap for VMAgent to reach it on the pod IP (default is
# localhost-only).
#
# Only web pods are scraped: the prometheus collector runs as a child
# of the unicorn master, so the HTTP server lives on the web pods.
# Sidekiq processes report their metrics to the collector via IPC,
# so discourse_sidekiq_* metrics surface on the web pods' :9405 too.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: discourse
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [discourse]
      - key: app.kubernetes.io/component
        operator: In
        values: [web]
  podMetricsEndpoints:
    - port: ""
      path: /metrics
      interval: 30s
      honorLabels: true
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: __address__
          replacement: ${1}:9405
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: component
