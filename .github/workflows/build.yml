name: Build and push Discourse image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (e.g. v0.1.0)'
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPO: 668807881758.dkr.ecr.eu-central-1.amazonaws.com/discourse

jobs:
  build:
    # ARM64 runner: mzla-eks-workloads01 default node groups (system,
    # general-arm64) are Graviton; the general-amd64 nodegroup has an
    # arch=amd64:NoSchedule taint, so an x86 image won't get a node by default.
    runs-on: ubuntu-24.04-arm
    # OIDC trust requires the Environment claim.
    environment: production
    steps:
      - name: Checkout discourse-deploy
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::668807881758:role/workloads-prod-discourse-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_REPO }}:latest
          # arm64 runner builds an arm64 image natively (no QEMU needed).
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.ECR_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REPO }}:buildcache,mode=max
