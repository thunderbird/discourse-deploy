# discourse_docker app.yml.
#
# We DO include postgres.template.yml + redis.template.yml even though
# our runtime data tier is external (RDS + ElastiCache). Reason:
# discourse_docker's bootstrap pipeline runs db:migrate and
# assets:precompile, both of which open live DB and Redis connections
# during boot of the Rails environment. Without these templates,
# bootstrap fails. With them, launcher starts Postgres + Redis inside
# the build container, lets bootstrap finish, and the resulting image
# has those binaries baked in but never started at runtime -- our
# K8s Deployments override DISCOURSE_DB_HOST and DISCOURSE_REDIS_HOST
# to point at RDS / ElastiCache.
#
# At deploy time, argocd/workloads/discourse-migrate-job.yaml runs
# migrations against RDS with the discourse_app_user.

templates:
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"

# No plugin clone hooks: discourse-openid-connect and discourse-prometheus
# are core/bundled plugins shipped with the base image already. Cloning
# them into $home/plugins fails with "destination path already exists"
# during bootstrap.

env:
  LANG: en_US.UTF-8
  RAILS_ENV: production
  UNICORN_WORKERS: 3
  DISCOURSE_HOSTNAME: discourse.thunderbird.net
